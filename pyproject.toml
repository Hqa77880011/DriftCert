[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftcert"
version = "0.1.0"
description = "Selective reauthorization by semantic refinement of evolving tool contracts implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "psutil>=5.9"]

[project.scripts]
driftcert = "driftcert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

